[project]
name = "starter-crm-server-python"
version = "0.1.0"
description = "Drop Cowboy Starter CRM server: mints site tokens and verifies webhooks. See ../CONTRACT.md."
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "python-dotenv==1.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
