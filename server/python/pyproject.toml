[project]
name = "starter-crm-server-python"
version = "0.1.0"
description = "Drop Cowboy Starter CRM server: mints site tokens and verifies webhooks. See ../CONTRACT.md."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "python-dotenv==1.2.4",
    "PyJWT[crypto]==2.15.1",
    "onepassword-sdk==0.4.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "redis==8.1.0",
    "bullmq==3.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, and pydocstyle
# (the starter is teaching code, so every public module, function and class
# carries a Google-style docstring; plan section 9.1).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests say what they protect in their names and comments, not in docstrings.
"tests/**" = ["D"]
