# Tests for the whole starter. Everything runs against fakes (see
# tests/README.md), so no Drop Cowboy account or secret is needed; the browser
# tests download only the pinned Building Blocks release. Secret scanning is
# .github/workflows/secret-scan.yml.
#
# Actions are pinned to commit SHAs; the comment after each is its release.

name: Starter CRM

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-crm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests for shared code, both servers and the React app; the server
  # contract suite against both servers; and the static leak checks. Runs on
  # the oldest and newest Python the starter supports.
  checks:
    name: Unit and contract tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    # Each server's conformance run takes about eight minutes against the real services.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/node/package-lock.json
            server/nextjs/package-lock.json
            server/netlify/package-lock.json
            react/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/python/requirements-dev.txt

      - name: Install cfn-lint for the AWS template tests
        run: pip install cfn-lint==1.57.2

      # The real services from tests/services.compose.yml. Without them their suites skip, so a
      # green run would say nothing about them. QStash is left out of compose because its image is
      # on ECR Public, whose anonymous pull allowance is shared by every job on a runner's IP and
      # runs out. The same release ships as a binary, which the next step runs instead.
      - name: Start Postgres, Valkey, OpenBao and the AWS stand-ins
        run: docker compose -f tests/services.compose.yml up -d --wait openbao postgres valkey dynamodb elasticmq valkey-cluster

      # Same release as the image pinned in tests/services.compose.yml; update the two together.
      # The suites tell QStash to deliver to host.docker.internal, which a container resolves to
      # the host, so the runner is given the same name.
      - name: Start the QStash development server
        env:
          QSTASH_VERSION: 2.40.12
          QSTASH_SHA256: b48277d761541074769074cab39c70b89f6d8123ce20763501adccc4240d6106
        run: |
          archive="qstash-server_${QSTASH_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -O "https://artifacts.upstash.com/qstash/versions/${QSTASH_VERSION}/${archive}"
          echo "${QSTASH_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" qstash
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          nohup ./qstash dev -port 58080 > qstash.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:58080/ && exit 0
            sleep 1
          done
          cat qstash.log
          exit 1

      - name: Run the tests
        run: npm run test:fast
        env:
          PYTHON: python

  # The app in Chromium: each server (Node, Python, and the Next.js and Netlify variants) with each front-end, plus the
  # Python server on 3.11 with the plain front-end.
  e2e:
    name: Browser (${{ matrix.server }} server, ${{ matrix.ui }}${{ matrix.server == 'python' && format(', Python {0}', matrix.python) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: [node, python, nextjs, netlify]
        ui: [vanilla, react]
        python: ['3.13']
        include:
          - server: python
            ui: vanilla
            python: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/node/package-lock.json
            server/nextjs/package-lock.json
            server/netlify/package-lock.json
            react/package-lock.json
            tests/e2e/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.server == 'python'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/python/requirements-dev.txt

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: |
          stages="e2e:${{ matrix.server }}:${{ matrix.ui }}"
          if [ "${{ matrix.server }}" = "nextjs" ]; then stages="nextjs:build,$stages"; fi
          if [ "${{ matrix.ui }}" = "react" ]; then stages="react:build,$stages"; fi
          node tests/run-all.mjs --only "$stages"
        env:
          PYTHON: python
          CI: 'true'

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.server }}-${{ matrix.ui }}-py${{ matrix.python }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
