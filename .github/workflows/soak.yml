# Nightly load and soak run: 500 open event streams while 50 signed webhooks a second arrive for 10 minutes,
# once with the SQLite outbox and once with Postgres, Redis fan-out and BullMQ, for each server. A run fails
# when a webhook takes over 1 s to acknowledge at p99, when a stream misses an event, or when memory grows.
# The script is scripts/soak.mjs; run it by hand with --duration 30 to try a change.
#
# Actions are pinned to commit SHAs; the comment after each is its release.

name: Starter CRM soak

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-crm-soak
  cancel-in-progress: false

jobs:
  soak:
    name: Soak (${{ matrix.server }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server: [node, python]
        profile: [sqlite, postgres-redis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/node/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.server == 'python'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/python/requirements-dev.txt

      - name: Install the server
        run: |
          if [ "${{ matrix.server }}" = "node" ]; then
            npm ci --prefix server/node --no-audit --no-fund
          else
            python -m venv server/python/.venv
            server/python/.venv/bin/pip install -r server/python/requirements.txt
          fi

      - name: Start Postgres and Valkey
        if: matrix.profile == 'postgres-redis'
        run: docker compose -f tests/services.compose.yml up -d --wait postgres valkey

      - name: Run the soak
        run: node scripts/soak.mjs --profile "${{ matrix.profile }}" --server "${{ matrix.server }}" --duration 600 --streams 500 --rate 50
