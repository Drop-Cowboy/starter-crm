# Secret scanning for the whole repository, plus the public content check that
# runs only in Drop Cowboy's own copy (Drop-Cowboy/starter-crm).
#
# gitleaks runs with .gitleaks.toml: the default rules, minus the exact test
# values the examples use. It is installed from the release and checked
# against the release's checksums file.
#
# The public content check reads its terms from the PUBLIC_CONTENT_DENYLIST
# Actions secret, which holds the denylist JSON. The terms are never committed.
# Where the secret isn't available, as on pull requests from forks, it runs
# with --patterns-only: every check except the terms.
#
# Actions are pinned to commit SHAs; the comment after each is its release.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "$base/$archive"
          curl -fsSL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  public-content:
    name: Public content check
    if: github.repository == 'Drop-Cowboy/starter-crm'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Also fails on any Building Blocks bundle or manifest: they are closed
      # source and must never be committed here.
      - name: Check every file
        env:
          PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files)
          if [ -n "${PUBLIC_CONTENT_DENYLIST}" ]; then
            denylist="$RUNNER_TEMP/public-content-denylist.json"
            printf '%s' "$PUBLIC_CONTENT_DENYLIST" > "$denylist"
            node .github/scripts/public-content-check.mjs --denylist "$denylist" "${files[@]}"
          else
            echo "::notice::PUBLIC_CONTENT_DENYLIST is not available here; checking patterns only."
            node .github/scripts/public-content-check.mjs --patterns-only "${files[@]}"
          fi
