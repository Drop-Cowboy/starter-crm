# gitleaks settings for the Starter CRM: the default rules, minus the
# placeholder tokens the docs and tests use on purpose.
#
#   gitleaks dir . --config .gitleaks.toml

[extend]
useDefault = true

[[allowlists]]
description = "Test JWTs whose signature is readable text (e.g. 'signature'), so they cannot be real tokens"
regexTarget = "match"
regexes = [
    '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.(c2lnbmF0dXJl|c2ln|bW9jay1zaWduYXR1cmU)\b''',
]

[[allowlists]]
description = "Example responses in the docs, with the token cut short"
regexTarget = "line"
regexes = [
    '''"token": "eyJ[A-Za-z0-9_-]+\.\.\."''',
]

[[allowlists]]
description = "A boot problem code and its message, such as missing_doppler_token. The code only looks like a key name"
regexTarget = "match"
regexes = [
    '''missing_[a-z_]*token['"],\s*['"]DC_SECRETS=''',
]

[[allowlists]]
description = "The QStash development server's own credential, which decodes to {\"UserID\":\"defaultUser\",\"Password\":\"defaultPassword\"} and is the same on every machine"
regexTarget = "match"
regexes = [
    '''QSTASH_TOKEN["']?:\s*["']eyJVc2VySUQiOiJkZWZhdWx0VXNlciIsIlBhc3N3b3JkIjoiZGVmYXVsdFBhc3N3b3JkIn0=["']''',
]
